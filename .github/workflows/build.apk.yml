name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java Development Kit (JDK 17) untuk Android SDK
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Dependencies Proyek & Build Web
      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      # 6. Install Capacitor & Setup Android Folder
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IX-H Smart Hub" "com.ixh.app" --web-dir dist
          npx cap add android
          npx cap sync android

      # 7. Beri Izin Eksekusi Gradle Wrapper
      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew

      # 8. Build APK Menggunakan Gradle
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 9. Upload File APK sebagai Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IXH-SmartHub-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
